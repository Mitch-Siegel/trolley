[package]
name = "trolley_example"
version = "0.1.0"
edition = "2024"

[dependencies]
trolley = { workspace = true }
async-trait = "0.1.89"
tokio = {version = "1.49.0", features = ["rt-multi-thread"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[build-dependencies]
trolley = { workspace = true, features = ["build"] }
